name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (for example, v0.1.3)
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish extension
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          path: automation
          persist-credentials: false

      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          path: release-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: release-source/package-lock.json

      - name: Derive release metadata
        id: release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node automation/scripts/release-metadata.js "$TAG" release-source/package.json >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: release-source
        run: npm ci

      - name: Check types
        working-directory: release-source
        run: npm run check:types

      - name: Lint
        working-directory: release-source
        run: npm run lint

      - name: Test
        working-directory: release-source
        run: npm test

      - name: Build production package
        working-directory: release-source
        run: npm run build:production

      - name: Package VSIX
        working-directory: release-source
        env:
          PRERELEASE_FLAG: ${{ steps.release.outputs.channel == 'prerelease' && '--pre-release' || '' }}
        run: npx vsce package --target win32-x64 --out dist/claude-workspaces-win32-x64.vsix $PRERELEASE_FLAG

      - name: Create checksum
        working-directory: release-source/dist
        run: sha256sum claude-workspaces-win32-x64.vsix > claude-workspaces-win32-x64.vsix.sha256

      - name: Extract release notes
        run: node automation/scripts/extract-changelog.js "${{ steps.release.outputs.version }}" > release_notes.md

      - name: Publish to VS Code Marketplace
        working-directory: release-source
        env:
          PRERELEASE_FLAG: ${{ steps.release.outputs.channel == 'prerelease' && '--pre-release' || '' }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath dist/claude-workspaces-win32-x64.vsix --skip-duplicate $PRERELEASE_FLAG

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Claude Workspaces ${{ steps.release.outputs.version }}
          body_path: release_notes.md
          prerelease: ${{ steps.release.outputs.channel == 'prerelease' }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-source/dist/claude-workspaces-win32-x64.vsix
            release-source/dist/claude-workspaces-win32-x64.vsix.sha256
