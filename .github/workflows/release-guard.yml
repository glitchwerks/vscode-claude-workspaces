name: Release Guard

# Native required-workflow rules ignore this filter. Ordinary untrusted PR
# runs are suppressed; this workflow must be required by its native identity.
on:
  pull_request:
    branches: ['__ruleset_only_release_guard__']

permissions: {}

concurrency:
  group: release-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-guard:
    name: Release Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Enforce release routing and scope
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_WORKFLOW_REF: ${{ github.workflow_ref }}
          POLICY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: node automation/scripts/check-release-pr.js
